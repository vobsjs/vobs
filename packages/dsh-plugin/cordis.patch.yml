# DSH combo patch layer: only appends its own plugin rows, never overrides any official entry.
#
# Applies before the profile's own cordis.patch.yml, so the toggles made by the user on the
# "Plugins" page (the disabled flag of the last same-name override) always take precedence.
- insert:
    - id: vobs-panel
      name: dsh-plugin-vobs
