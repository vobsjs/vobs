name: Release tag check

# `pnpm run check:release` validates "tag version == all publishable package versions", but it
# previously was **not invoked by any workflow** — so misalignment like "tagged but forgot to bump
# the package versions" had nothing to catch it (it genuinely happened historically: the commit
# v1.7.8 pointed at had unaligned versions).
#
# npm publishing in this repository is manual (see docs/npm-release.md), so this workflow only
# validates: when a tag is pushed, first confirm it matches the package versions, so problems
# surface before publishing.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Tag matches package versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GITHUB_REF_NAME is the tag name; the script picks it up itself
      - name: Tag matches publishable package versions
        run: pnpm run check:release
