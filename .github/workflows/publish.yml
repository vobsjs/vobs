name: Publish packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Validate release tag and package versions
        run: node scripts/check-release.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Verify package tarballs
        run: pnpm run verify:packages

      - name: Build framework and playground
        run: pnpm run build

      - name: Publish public packages
        run: pnpm run publish:packages
