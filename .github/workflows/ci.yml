name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

      # 三个 DSH 插件包不在 npm 发布名单里，靠 Git 标签 + 提交进仓库的 lib/ 分发。
      # 产物是签入的，所以源码改了却没重建时 CI 必须拦下来 —— 这些脚本只读 lib/
      # 并在 jsdom 里按 DSH 的客户端模块协议真跑一遍，不需要先构建任何东西。
      - name: Verify DSH plugin artifacts
        run: |
          node packages/dsh-plugin/scripts/verify-client.mjs
          node packages/dsh-console/scripts/verify-console.mjs
          node packages/dsh-devkit/scripts/verify-devkit.mjs

      # 自检：effect 自订阅 / 列表写进分支 / 组件体里读信号。错误会让 CI 失败，
      # 警告不会（playground 里有几条真实但需要人判断的写法）。
      - name: Lint vobs source
        run: pnpm run check:source

      - name: Verify published package artifacts
        run: pnpm run verify:packages

      - name: Build framework, typecheck, and playground
        run: pnpm run build
