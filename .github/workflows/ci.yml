name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

      # The three DSH plugin packages are not on the npm release list; they are distributed via Git
      # tags + lib/ artifacts committed to the repository. This step verifies **that the checked-in
      # artifacts themselves work**: the scripts only read lib/ and actually run them in jsdom under
      # DSH's client module protocol — nothing needs to be built first. Whether the artifacts are
      # **in sync with the source** is the next step's job.
      - name: Verify DSH plugin artifacts
        run: |
          node packages/dsh-plugin/scripts/verify-client.mjs
          node packages/dsh-console/scripts/verify-console.mjs
          node packages/dsh-devkit/scripts/verify-devkit.mjs

      # Self-check: effect self-subscription / lists written into branches / signal reads in component
      # bodies. Errors fail CI, warnings do not (the playground contains a few real but
      # human-judgment-call patterns).
      - name: Lint vobs source
        run: pnpm run check:source

      # Phantom dependencies: A imports B without declaring it in its own package.json.
      # verify:packages packs the 37 packages into one temporary project, so it structurally
      # cannot detect this class of problem.
      - name: Check package dependency declarations
        run: pnpm run check:imports

      - name: Check scripts for TypeScript annotations in .mjs
        run: pnpm run check:scripts

      - name: Check capability index is not stale
        run: pnpm run checks -- --check

      - name: Verify published package artifacts
        run: pnpm run verify:packages

      # "Changed the source but forgot to rebuild" can only be caught by rebuilding and diffing — the
      # assertion on the version number embedded in the artifacts only covers "bumped the framework
      # version without rebuilding", while the Console and DevKit artifacts contain no version number
      # at all. The plugin build is deterministic (measured locally: rebuilds are byte-identical), so a
      # direct diff is safe here.
      # Depends on the previous step's verify:packages (it runs build:packages, producing the dist of
      # @vobs/dsh and vite-plugin).
      - name: DSH plugin artifacts match current source
        run: |
          pnpm run build:dsh
          git diff --exit-code -- packages/dsh-plugin/lib packages/dsh-console/lib packages/dsh-devkit/lib

      - name: Build framework, typecheck, and playground
        run: pnpm run build
