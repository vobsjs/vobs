name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

      # 三个 DSH 插件包不在 npm 发布名单里，靠 Git 标签 + 提交进仓库的 lib/ 分发。
      # 这一步校验**签入的产物本身能不能用**：脚本只读 lib/，在 jsdom 里按 DSH 的客户端
      # 模块协议真跑一遍，不需要先构建任何东西。产物是否**与源码同步**由下面那一步负责。
      - name: Verify DSH plugin artifacts
        run: |
          node packages/dsh-plugin/scripts/verify-client.mjs
          node packages/dsh-console/scripts/verify-console.mjs
          node packages/dsh-devkit/scripts/verify-devkit.mjs

      # 自检：effect 自订阅 / 列表写进分支 / 组件体里读信号。错误会让 CI 失败，
      # 警告不会（playground 里有几条真实但需要人判断的写法）。
      - name: Lint vobs source
        run: pnpm run check:source

      # 幻影依赖：A 用了 B 却没在自己的 package.json 里声明。
      # verify:packages 把 37 个包装进同一个临时工程，所以它结构上发现不了这类问题。
      - name: Check package dependency declarations
        run: pnpm run check:imports

      - name: Verify published package artifacts
        run: pnpm run verify:packages

      # 「改了源码忘了重建」只有重建比对才拦得住 —— 产物内嵌版本号的那条断言只覆盖
      # 「bump 了框架版本没重建」这一种，而 Console 与开发台的产物里根本没有版本号。
      # 插件构建是确定性的（本地实测重建后逐字节一致），所以这里可以直接比对。
      # 依赖上一步的 verify:packages（它会跑 build:packages，产出 @vobs/dsh 与 vite-plugin 的 dist）。
      - name: DSH plugin artifacts match current source
        run: |
          pnpm run build:dsh
          git diff --exit-code -- packages/dsh-plugin/lib packages/dsh-console/lib packages/dsh-devkit/lib

      - name: Build framework, typecheck, and playground
        run: pnpm run build
